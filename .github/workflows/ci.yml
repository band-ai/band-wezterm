name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check

  unit:
    name: unit + pilot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: uv lock --check
      - run: uv sync --locked
      - run: just coverage
      - name: Upload branch coverage
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-${{ matrix.os }}
          path: coverage.json
          if-no-files-found: error

  wezterm-cli:
    name: wezterm mux CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install WezTerm (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/wezterm-fury.gpg
          echo 'deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *' | sudo tee /etc/apt/sources.list.d/wezterm.list
          sudo apt-get update
          sudo apt-get install -y wezterm
      - name: Install WezTerm (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask wezterm
      - name: Install WezTerm (Windows)
        id: wezterm_windows
        if: runner.os == 'Windows'
        run: winget install --id wez.wezterm -e --accept-source-agreements --accept-package-agreements
        continue-on-error: true
      - name: Install Band WezTerm (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./install.sh
      - name: Install Band WezTerm (Windows)
        if: runner.os == 'Windows' && steps.wezterm_windows.outcome == 'success'
        shell: cmd
        run: install.bat
      - run: uv sync --locked
      - run: uv run pytest tests/integration/test_wezterm_cli_live.py -q

  pty:
    name: control tab PTY (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Live platform API cases self-skip without BAND_API_KEY_USER (same
      # opt-in gate as band-plugin-vsc). Do not inject that secret here —
      # api.dev is not reachable from GHA, and a present key turned opt-in
      # into a hard red ConnectError. Run live locally via .env.test.
      - name: Control tab PTY
        run: uv run pytest tests/integration/test_control_tab_pty.py -q
