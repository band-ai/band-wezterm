[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "band-wezterm"
version = "0.1.0"
description = "Band terminal host for WezTerm"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "band.ai" }]
license = { text = "MIT" }
dependencies = [
    "band-sdk>=3.1.1",
    "band-client-rest==0.0.27",
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "textual>=1.0.0",
    "phoenix-channels-python-client>=0.2.4",
]


[project.optional-dependencies]
claude_sdk = ["band-sdk[claude-sdk]>=3.1.1"]
codex = ["band-sdk[codex]>=3.1.1"]
copilot_sdk = ["band-sdk[copilot-sdk]>=3.1.1"]
opencode = ["band-sdk[opencode]>=3.1.1"]
agents = [
    "band-sdk[claude-sdk]>=3.1.1",
    "band-sdk[codex]>=3.1.1",
    "band-sdk[copilot-sdk]>=3.1.1",
    "band-sdk[opencode]>=3.1.1",
]

[project.scripts]
band-wezterm = "band_wezterm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/band_wezterm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_wezterm: requires wezterm on PATH",
    "live_platform: requires BAND_API_KEY_USER from .env.test",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
    "pyinstaller>=6.0.0",
]

[tool.uv]
default-groups = ["dev"]
