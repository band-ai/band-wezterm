[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "band-wezterm"
version = "0.6.0"
description = "Band terminal host for WezTerm"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "band.ai" }]
license = { text = "MIT" }
dependencies = [
    "band-sdk>=3.1.1",
    "band-client-rest==0.0.27",
    "filelock>=4.0.1",
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "textual>=1.0.0",
    "phoenix-channels-python-client>=0.2.4",
    "cyclopts>=4.25.3",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/band-ai/band-wezterm"
Documentation = "https://docs.band.ai"
Repository = "https://github.com/band-ai/band-wezterm"
Issues = "https://github.com/band-ai/band-wezterm/issues"

[project.optional-dependencies]
claude_sdk = ["band-sdk[claude-sdk]>=3.1.1"]
codex = ["band-sdk[codex]>=3.1.1"]
copilot_sdk = ["band-sdk[copilot-sdk]>=3.1.1"]
opencode = ["band-sdk[opencode]>=3.1.1"]
agents = [
    "band-sdk[claude-sdk]>=3.1.1",
    "band-sdk[codex]>=3.1.1",
    "band-sdk[copilot-sdk]>=3.1.1",
    "band-sdk[opencode]>=3.1.1",
]

[project.scripts]
band = "band_wezterm.__main__:main"
band-wezterm = "band_wezterm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/band_wezterm"]

# Repo-root plugin/init.lua is the WezTerm plugin SSOT; ship a copy in the wheel
# so setup can materialize a local file:// plugin without GitHub HTTPS auth.
[tool.hatch.build.targets.wheel.force-include]
"plugin/init.lua" = "band_wezterm/wezterm_plugin/init.lua"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_wezterm: requires wezterm on PATH",
    "live_platform: requires BAND_API_KEY_USER from .env.test",
]

[tool.coverage.run]
branch = true
source = ["band_wezterm"]

[tool.coverage.report]
# The suite currently measures 68.92%. Raise this ratchet as the uncovered UI and
# managed-runtime flows receive executable coverage; do not mask them.
fail_under = 68
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.0.0",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
    "pyinstaller>=6.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff.lint]
# Stricter than band-sdk-python's documented baseline: pycodestyle, pyflakes,
# isort, bugbear, pyupgrade, simplify, ruff, async, pylint (incl. PLC0415),
# pie, pytest-style, return, comprehensions, perf. E501 left to readability /
# formatter rather than hard-failing CI on wrap style.
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PLC",
    "PLE",
    "PLW",
    "PIE",
    "PT",
    "RET",
    "C4",
    "PERF",
]
ignore = [
    "E501",
]
